<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>
</head>
<body>
     <header class="header">
        

        <div class="container">

            <a href="#" class="logo">
            ЛЕСЪТИМ
        </a>

            <nav class="nav">

                <a href="#furniture">
                    Мебель
                </a>

                <a href="#projects">
                    Выставочные проекты
                </a>

                <a href="#production">
                    Производство
                </a>

                <a href="#contacts">
                    Контакты
                </a>

               

            </nav>
   


        </div>

    </header>
    <section class="hero" id="home">

    <div class="container">

        <div class="hero-top">

            <div class="hero-content">

                <h1>
                    Мебель и выставочные конструкции на заказ
                </h1>

                <p>
                    Изготавливаем мебель и выставочные конструкции под задачи вашего проекта
                </p>

                <div class="hero-buttons">

                    <a href="#furniture" class="main-button">
                        Наши работы
                    </a>

                    <a href="#contacts" class="second-button">
                        Связаться с нами
                    </a>

                </div>

            </div>

            <div class="hero-image">

                <img
                    src="материал к сайту/фотки/выставочные/5.jpg"
                    alt="Мебель производства ЛЕСЪТИМ"
                >

            </div>

        </div>

    </div>

</section>
<section class="furniture" id="furniture">

    <div class="container">

        <div class="section-heading">

            

            <h2>
                Мебель на заказ
            </h2>

            <p>
                Изготавливаем мебель под задачи и особенности вашего проекта
            </p>

        </div>


        <div class="furniture-categories">

            <div class="furniture-category">

                <button
                    class="category-button"
                    data-category="kitchens"
                >
                    <span>Кухни</span>
                    <span class="category-icon">+</span>
                </button>

                <div class="furniture-gallery"></div>

            </div>


            <div class="furniture-category">

                <button
                    class="category-button"
                    data-category="wardrobes"
                >
                    <span>Шкафы</span>
                    <span class="category-icon">+</span>
                </button>

                <div class="furniture-gallery"></div>

            </div>


            <div class="furniture-category">

                <button
                    class="category-button"
                    data-category="tables"
                >
                    <span>Столы</span>
                    <span class="category-icon">+</span>
                </button>

                <div class="furniture-gallery"></div>

            </div>


            <div class="furniture-category">

                <button
                    class="category-button"
                    data-category="beds"
                >
                    <span>Кровати</span>
                    <span class="category-icon">+</span>
                </button>

                <div class="furniture-gallery"></div>

            </div>

        </div>

    </div>

</section>
<script src="script.js">

</script>
</body>
</html>
